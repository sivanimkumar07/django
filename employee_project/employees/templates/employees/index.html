<!DOCTYPE html>
<html>

<head>
    <title>Employee Directory</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            color: #333;
        }

        .employee {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            width: 400px;
        }

        .full-time {
            color: green;
            font-weight: bold;
        }

        .part-time {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Employee Directory</h1>

    {% if employees %}

    {% for employee in employees %}

    <div class="employee">

        <h2>{{ employee.name }}</h2>

        <p>
            <strong>Job Title:</strong>
            {{ employee.job_title }}
        </p>

        <p>
            <strong>Salary:</strong>
            ₹{{ employee.salary }}
        </p>

        {% if employee.full_time %}
        <p class="full-time">Full-Time</p>
        {% else %}
        <p class="part-time">Part-Time</p>
        {% endif %}

    </div>

    {% endfor %}

    {% else %}

    <p>No employees available.</p>

    {% endif %}

</body>

</html>
