<!DOCTYPE html>
<html>

<head>
    <title>Result</title>
</head>

<body>

    <h1>
        Hello {{ name }}, your favorite color is {{ color }}!
    </h1>

    <h2>Submitted Form Data</h2>

    <ul>
        {% for key, value in form_data.items %}
        <li>
            <strong>{{ key }}</strong> : {{ value }}
        </li>
        {% endfor %}
    </ul>

</body>

</html>
