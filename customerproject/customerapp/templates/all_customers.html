<!DOCTYPE html>
<html>
<head>
    <title>All Customers</title>
</head>
<body>

<h1>All Customers</h1>

{% for customer in customers %}

<p>
    Name : {{ customer.name }}
    <br>
    Email : {{ customer.email }}
</p>

<hr>

{% empty %}

<p>No Customers Found</p>

{% endfor %}

<a href="/">
    Add Customer
</a>

</body>
</html>
