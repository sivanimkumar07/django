<!DOCTYPE html>

<html>

<head>
    <title>Student List</title>

    ```
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .student {
            background-color: white;
            padding: 15px;
            margin: 15px auto;
            width: 400px;
            border-radius: 8px;
        }

        .passed {
            color: green;
            font-weight: bold;
        }

        .failed {
            color: red;
            font-weight: bold;
        }
    </style>
    ```

</head>

<body>

    ```
    <h1>Classroom Students</h1>

    {% if students %}

    {% for student in students %}

    <div class="student">

        <h2>{{ student.name }}</h2>

        <p>
            <strong>Grade:</strong>
            {{ student.grade }}
        </p>

        {% if student.passed %}
        <p class="passed">Passed</p>
        {% else %}
        <p class="failed">Failed</p>
        {% endif %}

    </div>

    {% endfor %}

    {% else %}

    <p>No students found.</p>

    {% endif %}
    ```

</body>

</html>
